<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StakBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">StakBridge</span>
    <nav id="tabs">
      <button data-tab="accounts" class="active">Accounts</button>
      <button data-tab="strategies">Strategies</button>
      <button data-tab="trades">Trades</button>
    </nav>
    <div class="right">
      <span id="kill-banner" hidden>Trading stopped</span>
      <button id="kill-btn" class="danger">Stop all</button>
      <button id="logout-btn" class="link" title="Forget the API token in this browser">Sign out</button>
    </div>
  </header>

  <main>
    <section id="login" hidden>
      <h2>API token</h2>
      <p>Paste a token created with <code>python -m stakbridge create-token</code>.</p>
      <form id="login-form">
        <input id="token-input" type="password" autocomplete="off" placeholder="sb_..." required>
        <button type="submit" class="primary">Continue</button>
      </form>
      <p id="login-error" class="error"></p>
    </section>

    <div id="app" hidden>
      <p id="message" class="message" hidden></p>
      <div id="view"></div>

      <details id="add-account" class="panel">
        <summary>+ Add account</summary>
        <form id="account-form" class="grid-form">
          <label>Name <input name="name" required></label>
          <label>Account id <input name="id" placeholder="optional, e.g. acct_a" pattern="[A-Za-z0-9_\-]{1,40}"></label>
          <label>MT5 login <input name="login" type="number" min="1" required></label>
          <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
          <label>Server <input name="server" placeholder="e.g. Broker-Demo" required></label>
          <label>Symbol suffix <input name="symbolSuffix" placeholder="e.g. .m (empty if none)"></label>
          <label class="wide">Terminal path <input name="terminalPath" placeholder="C:\MT5\acct_a\terminal64.exe (one terminal folder per account)"></label>
          <div class="wide actions">
            <button type="submit" class="primary">Add account</button>
            <span class="hint">Trading starts OFF. Switch it on once the account shows Connected.</span>
          </div>
        </form>
      </details>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
